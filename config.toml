# Opticrum Server Configuration
#
# This file is read on startup. CLI flags and environment variables
# (OPTICRUM_*) override values in this file.
#
# Priority: CLI flags > env vars > this file > built-in defaults
#
# Signing uses the built-in HD wallet. Unlock the keystore in the admin
# panel to load signing keys into memory.

# ---- Network ----
port = 8080
bind_address = "0.0.0.0"
database_url = "data/opticrum.db"
keystore_path = "data/keystore.json"

# ---- CKB Chain ----
# The network (testnet/mainnet) is auto-detected from the RPC URL.
ckb_rpc_url = "https://testnet.ckb.dev"
ckb_indexer_url = "https://testnet.ckb.dev"

# ---- Fiber Network ----
fiber_rpc_url = "http://localhost:8227"

# ---- Fees ----
fee_rate = 2000                              # shannons per KB
confirm_count = 1                            # block confirmations to wait for each tx

# ---- Rent Extraction ----
rent_extraction_enabled = false               # enable background extraction scheduler
scheduler_interval_secs = 3600                # seconds between extraction cycles
min_extraction_amount_shannons = 1000000000   # 10 CKB dust threshold

# ---- Auto-Match ----
auto_match_enabled = false
auto_match_min_capacity = 100000000000       # 1000 CKB
auto_match_max_escrow_blocks = 432000        # ~30 days at 6s/block
auto_match_interval_secs = 300

# ---- Logging ----
log_level = "info"                           # trace, debug, info, warn, error
