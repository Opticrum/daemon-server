[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["macros"] }
actix-rt = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Opticrum (path deps to sibling project)
opticrum-calculator = { path = "../opticrum/calculator/opticrum" }
opticrum-protocol = { path = "../opticrum/opticrum-protocol" }

# CKB chain interaction (local path — matches opticrum workspace)
ckb-cinnabar-calculator = { git = "https://github.com/ashuralyk/ckb-cinnabar.git", branch = "master" }

# Database (Diesel ORM — no raw SQL)
diesel = { version = "2", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = { version = "2", features = ["sqlite"] }
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# Crypto (wallet key management)
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
bech32 = "0.9"
sha2 = "0.10"

# BIP39 mnemonic + BIP32 HD wallet
bip39 = { version = "2", features = ["rand", "all-languages"] }
blake2b_simd = "1"
hmac = "0.12"

# CLI
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (Fiber RPC proxy, also transitive via ckb-cinnabar)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Fiber JSON-RPC types (from local Fiber repo — no type duplication)
fiber-json-types = { path = "../../../Cryptape/fiber/lightning-network/fiber/crates/fiber-json-types" }

# Molecule (used for parsing channel outpoint from fiber-json-types)
molecule = "0.9"

# Error handling (for vendored fiber-cli RPC client)
anyhow = "1.0"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

actix-files = "0.6"

[dev-dependencies]
actix-test = "0.1"
tempfile = "3"

[[test]]
name = "db_tests"
path = "tests/db_tests.rs"

[[test]]
name = "wallet_service_tests"
path = "tests/wallet_service_tests.rs"

[[test]]
name = "match_service_tests"
path = "tests/match_service_tests.rs"

[[test]]
name = "rent_service_tests"
path = "tests/rent_service_tests.rs"

[[test]]
name = "api_tests"
path = "tests/api_tests.rs"

[[test]]
name = "scheduler_tests"
path = "tests/scheduler_tests.rs"

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"
