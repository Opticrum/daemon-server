[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { version = "4", features = ["macros"] }
actix-rt = "2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Opticrum (path deps to sibling project)
opticrum-calculator = { path = "../opticrum/calculator/opticrum" }
opticrum-protocol = { path = "../opticrum/opticrum-protocol" }

# CKB chain interaction (git dep — not in opticrum workspace)
ckb-cinnabar-calculator = { git = "https://github.com/ashuralyk/ckb-cinnabar.git", branch = "master" }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Crypto (wallet key management)
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
bech32 = "0.9"
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

actix-files = "0.6"

[dev-dependencies]
actix-test = "0.1"
tempfile = "3"

[[test]]
name = "db_tests"
path = "tests/db_tests.rs"

[[test]]
name = "wallet_service_tests"
path = "tests/wallet_service_tests.rs"

[[test]]
name = "order_service_tests"
path = "tests/order_service_tests.rs"

[[test]]
name = "match_service_tests"
path = "tests/match_service_tests.rs"

[[test]]
name = "rent_service_tests"
path = "tests/rent_service_tests.rs"

[[test]]
name = "api_tests"
path = "tests/api_tests.rs"

[[test]]
name = "scheduler_tests"
path = "tests/scheduler_tests.rs"

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"
